name: iOS derleme

# `archive` işi: her push/PR'da imzasız Release archive üretir (derleme bozulmadı mı
# kontrolü, sır gerekmez). `release-ipa` işi: v* tag'i veya elle "release" ile, App
# Store Connect API anahtarıyla imzalı, App Store'a yüklenebilir .ipa üretir — bkz.
# capacitor-app/README.md "CI / Otomatik derleme".

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - "enerji-bulmaca.html"
      - "capacitor-app/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "İmzalı App Store IPA üret (Apple API anahtarı sırları gerekir)"
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive:
    runs-on: macos-26
    defaults:
      run:
        working-directory: capacitor-app
    env:
      ADMOB_APP_ID_IOS: ${{ secrets.ADMOB_APP_ID_IOS }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: capacitor-app/package-lock.json

      - name: Bağımlılıklar
        run: npm ci

      - name: Sürüm adını belirle
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            # Apple CFBundleShortVersionString yalnız 1-3 nokta ayrılmış tam sayı kabul eder
            # ("0.0.0-ci.66" altool'da -19239 ile reddedilir) -> tag'siz CI'da 0.0.<run>.
            echo "version=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Native projeyi üret (sync + cap add ios + native:config + pod install)
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
        run: npm run add:ios

      - name: İmzasız archive
        working-directory: capacitor-app/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="${{ steps.meta.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Archive'ı paketle
        run: ditto -c -k --keepParent "$RUNNER_TEMP/App.xcarchive" "$RUNNER_TEMP/App.xcarchive.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: enerji-baglantisi-ios-xcarchive
          path: ${{ runner.temp }}/App.xcarchive.zip
          if-no-files-found: error

  # ── Tag (v*) veya elle "release": App Store Connect API anahtarıyla imzalı .ipa ──
  release-ipa:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: macos-26
    timeout-minutes: 20  # -allowProvisioningUpdates yetersiz izinle asılı kalabiliyor — saatlerce beklemek yerine erken hata ver
    defaults:
      run:
        working-directory: capacitor-app
    env:
      ADMOB_APP_ID_IOS: ${{ secrets.ADMOB_APP_ID_IOS }}
    steps:
      - uses: actions/checkout@v5

      - name: İmzalama sırları var mı?
        id: gate
        env:
          KEY_B64: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          ISSUER_ID_RAW: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          TEAM_ID_RAW: ${{ secrets.APPSTORE_TEAM_ID }}
        run: |
          if [ -z "$KEY_B64" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APPSTORE_API_PRIVATE_KEY tanımlı değil — imzalı IPA derlemesi atlandı."
            exit 0
          fi
          # GitHub secret kutusuna yapıştırırken sona kaçan \n/\r ve boşlukları temizle —
          # dosya yoluna karışırsa xcodebuild "keyPathInvalidFormat" ile kırılıyor.
          trim() { printf '%s' "$1" | tr -d '\n\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          # KEY_ID gizli değil (AuthKey_<KEY_ID>.p8 dosya adının kendisi) — secret yerine
          # sabit. APPSTORE_API_PRIVATE_KEY bu Key ID'ye ait .p8 olmalı (AuthKey_Z4B2M8QU2M.p8).
          {
            echo "KEY_ID=Z4B2M8QU2M"
            echo "ISSUER_ID=$(trim "$ISSUER_ID_RAW")"
            echo "TEAM_ID=$(trim "$TEAM_ID_RAW")"
          } >> "$GITHUB_ENV"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        if: steps.gate.outputs.ok == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: capacitor-app/package-lock.json

      - name: Bağımlılıklar
        if: steps.gate.outputs.ok == 'true'
        run: npm ci

      - name: Sürüm adını belirle
        id: meta
        if: steps.gate.outputs.ok == 'true'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            # Apple CFBundleShortVersionString yalnız 1-3 nokta ayrılmış tam sayı kabul eder
            # ("0.0.0-ci.66" altool'da -19239 ile reddedilir) -> tag'siz CI'da 0.0.<run>.
            echo "version=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Native projeyi üret (sync + cap add ios + native:config + pod install)
        if: steps.gate.outputs.ok == 'true'
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
        run: npm run add:ios

      - name: API anahtarını çöz + doğrula
        if: steps.gate.outputs.ok == 'true'
        env:
          KEY_B64: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        # macOS'ta `base64 -d` bayrağı belirsiz (BSD sürümü farklı) -> Node ile çöz.
        # KEY_ID artık gate adımında temizlenmiş (GITHUB_ENV) -> düz $KEY_ID kullanılır.
        run: |
          export KEYFILE="$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8"
          echo "-- hedef dosya: $KEYFILE --"
          node -e "
            const fs = require('node:fs');
            const path = require('node:path');
            fs.mkdirSync(path.dirname(process.env.KEYFILE), { recursive: true });
            fs.writeFileSync(process.env.KEYFILE, Buffer.from(process.env.KEY_B64, 'base64'));
          "
          ls -la "$(dirname "$KEYFILE")"
          chmod 600 "$KEYFILE"
          echo "KEYFILE=$KEYFILE" >> "$GITHUB_ENV"
          echo "-- secret uzunluğu: ${#KEY_B64} karakter (beklenen ~344) --"
          echo "-- çözülen dosya: $(wc -c < "$KEYFILE" | tr -d ' ') byte (beklenen ~256) --"
          echo "-- ilk/son satır (BEGIN/END PRIVATE KEY görünmeli) --"
          head -1 "$KEYFILE"
          tail -1 "$KEYFILE"
          echo "-- openssl ile içerik doğrulaması --"
          openssl pkey -in "$KEYFILE" -noout && echo "Anahtar formatı GEÇERLİ" || { echo "::error::.p8 içeriği geçersiz — APPSTORE_API_PRIVATE_KEY secret'ını kontrol et"; exit 1; }

      - name: App Store Connect API erişim testi
        if: steps.gate.outputs.ok == 'true'
        # xcodebuild -allowProvisioningUpdates App Store Connect API'sine bağlanır;
        # KEY_ID/ISSUER_ID/.p8 üçlüsü yanlış ya da rol yetersizse "archive" adımı
        # "Communication with Apple failed ... (401)" ile kırılır. Burada aynı JWT'yi
        # kurup Apple'ın döndürdüğü ham hatayı gösteriyoruz (KEY_ID / ISSUER_ID
        # $GITHUB_ENV'den, KEYFILE bir önceki adımdan).
        run: |
          cat > "$RUNNER_TEMP/asc_test.mjs" <<'EOF'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const b64url = (b) => Buffer.from(b).toString('base64url');
          const KEY_ID = (process.env.KEY_ID || '').trim();
          const ISSUER_ID = (process.env.ISSUER_ID || '').trim();
          const pem = fs.readFileSync(process.env.KEYFILE);
          console.log(`KEY_ID uzunlugu: ${KEY_ID.length} (Key ID normalde 10 karakter)`);
          console.log(`ISSUER_ID uzunlugu: ${ISSUER_ID.length} (Issuer ID normalde 36 karakter, UUID)`);
          console.log(`.p8 boyutu: ${pem.length} byte  ilk satir: ${pem.toString('utf8').split(/\r?\n/)[0]}`);
          const now = Math.floor(Date.now() / 1000);
          const makeJwt = (extra) => {
            const head = b64url(JSON.stringify({ alg: 'ES256', kid: KEY_ID, typ: 'JWT' }));
            const body = b64url(JSON.stringify({ iat: now, exp: now + 900, aud: 'appstoreconnect-v1', ...extra }));
            const si = `${head}.${body}`;
            const sig = crypto.createSign('SHA256').update(si).sign({ key: pem, dsaEncoding: 'ieee-p1363' });
            if (sig.length !== 64) console.log(`UYARI: ES256 imza uzunlugu ${sig.length}, 64 bekleniyordu`);
            return `${si}.${b64url(sig)}`;
          };
          const tryJwt = async (label, jwt) => {
            const r = await fetch('https://api.appstoreconnect.apple.com/v1/apps?limit=200', { headers: { Authorization: `Bearer ${jwt}` } });
            const t = await r.text();
            console.log(`[${label}] HTTP ${r.status}`);
            if (r.status === 200) return JSON.parse(t);
            console.log('  ' + t.replace(/\s+/g, ' ').slice(0, 300));
            return null;
          };
          let data = await tryJwt('team-key (iss)', makeJwt({ iss: ISSUER_ID }));
          if (!data) data = await tryJwt('individual-key (sub:user)', makeJwt({ sub: 'user' }));
          if (!data) {
            console.log('::error::App Store Connect API her iki JWT biciminde de 401. APPSTORE_API_KEY_ID ile APPSTORE_API_PRIVATE_KEY (.p8) ayni anahtardan degil, APPSTORE_API_ISSUER_ID yanlis, ya da anahtar iptal edilmis. Cozum: App Store Connect > Users and Access > Integrations > App Store Connect API bolumunde anahtari silip Admin roluyle yeniden olustur, yeni .p8 indir, ve UC secret i birlikte guncelle.');
            process.exit(1);
          }
          const apps = data.data.map((a) => a.attributes.bundleId);
          console.log('Hesaptaki uygulamalar: ' + (apps.join(', ') || '(yok)'));
          console.log(apps.includes('com.enerji.baglantisi') ? 'com.enerji.baglantisi kaydi VAR.' : '::warning::com.enerji.baglantisi App Store Connect te kayitli degil (yukleme icin gerekir).');
          EOF
          node "$RUNNER_TEMP/asc_test.mjs"

      - name: Distribution sertifikasını keychain'e içe aktar
        if: steps.gate.outputs.ok == 'true'
        env:
          P12_B64: ${{ secrets.APPSTORE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATE_PASSWORD }}
        # Ephemeral macOS runner'da sertifika+private key kalıcı değil -> her
        # çalıştırmada aynı, önceden üretilmiş .p12'yi geçici bir keychain'e
        # aktarıyoruz (GitHub'ın resmi Apple sertifika kurulum deseni).
        run: |
          if [ -z "$P12_B64" ]; then
            echo "::error::APPSTORE_CERTIFICATE_P12 tanımlı değil"; exit 1
          fi
          export P12_PATH="$RUNNER_TEMP/dist_cert.p12"
          node -e "
            const fs = require('node:fs');
            fs.writeFileSync(process.env.P12_PATH, Buffer.from(process.env.P12_B64, 'base64'));
          "
          # GitHub secret kutusuna yapıştırırken sona kaçan \r\n, security import'ta
          # "MAC verification failed during PKCS12 import (wrong password?)" olur.
          P12_PW="$(printf '%s' "$P12_PASSWORD" | tr -d '\r\n')"

          echo "-- .p12 tanı (openssl $(openssl version)) --"
          echo "  boyut: $(wc -c < "$P12_PATH" | tr -d ' ') byte"
          PEM="$RUNNER_TEMP/dist_cert.pem"
          if   openssl pkcs12 -in "$P12_PATH" -passin "pass:$P12_PW" -nodes -legacy > "$PEM" 2>"$RUNNER_TEMP/o1.log"; then :
          elif openssl pkcs12 -in "$P12_PATH" -passin "pass:$P12_PW" -nodes         > "$PEM" 2>"$RUNNER_TEMP/o2.log"; then :
          else
            echo "::error::openssl .p12'yi açamadı — APPSTORE_CERTIFICATE_PASSWORD yanlış veya APPSTORE_CERTIFICATE_P12 base64'ü bozuk/eksik"
            sed 's/^/    /' "$RUNNER_TEMP/o1.log" "$RUNNER_TEMP/o2.log" 2>/dev/null || true
            exit 1
          fi
          echo "  openssl p12'yi açtı — parola DOĞRU"
          grep -q 'BEGIN .*PRIVATE KEY' "$PEM" \
            || { echo "::error::.p12 içinde private key YOK — yalnız sertifika var; anahtarı da içeren .p12 gerekli"; exit 1; }

          # macOS `security` importer'ı OpenSSL 3.x'in AES-256/SHA-256 p12'sini okuyamaz
          # ("MAC verification failed"); legacy (PBE-SHA1-3DES + SHA1 MAC) yeniden paketle.
          LEGACY="$RUNNER_TEMP/dist_cert_legacy.p12"
          if   openssl pkcs12 -export -legacy -in "$PEM" -out "$LEGACY" -passout "pass:$P12_PW" -name "Apple Distribution" 2>/dev/null; then P12_PATH="$LEGACY"; echo "  -> legacy .p12 hazır (-legacy)"
          elif openssl pkcs12 -export -in "$PEM" -out "$LEGACY" -passout "pass:$P12_PW" -name "Apple Distribution" -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg sha1 2>/dev/null; then P12_PATH="$LEGACY"; echo "  -> legacy .p12 hazır (-certpbe/-keypbe)"
          else echo "  legacy yeniden paketleme atlandı — özgün .p12 kullanılacak"
          fi
          rm -f "$PEM"

          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          # Geçici keychain parolası — at-değer, gizli olması gerekmiyor. ESKİ HÂLİ
          # `tr -dc … < /dev/urandom | head -c 32` idi; macOS bash 3.2 + pipefail
          # altında SIGPIPE yüzünden BOŞ dönebiliyor -> set-key-partition-list boş
          # parolayla GUI parola diyaloğu açıp ~20 dk asılı kalıyordu (iş iptali).
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -P "$P12_PW" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          # partition list'i arama listesini değiştirmeden ÖNCE ayarla (resmi sıra);
          # hemen öncesinde bir kez daha unlock -> kilitli keychain GUI prompt'unu önler.
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/[\" ]//g')
          echo "-- keychain'deki kimlikler --"
          IDENT_OUT="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          echo "$IDENT_OUT"
          echo "$IDENT_OUT" | grep -qE '[1-9][0-9]* valid identities found' || {
            echo "::error::Geçici keychain'de imzalama kimliği yok — APPSTORE_CERTIFICATE_P12 / _PASSWORD secret'larını kontrol et"
            exit 1
          }

      - name: exportOptions.plist üret
        if: steps.gate.outputs.ok == 'true'
        run: |
          cat > "$RUNNER_TEMP/exportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST

      - name: Archive (imzasız — App Store imzası export adımında)
        if: steps.gate.outputs.ok == 'true'
        working-directory: capacitor-app/ios/App
        run: |
          # İmzayı burada YAPMA. Capacitor projesi App hedefine "Apple Development"
          # gömüyor -> archive Development profili istiyor (cihaz kaydı gerektirir);
          # "Apple Distribution" override'ı ise Pods hedeflerinde "conflicting
          # provisioning settings" veriyor. Çözüm: imzasız archive (adanmış `archive`
          # işi de böyle) + gerçek App Store imzasını -exportArchive'ın method=app-store
          # & -allowProvisioningUpdates ile yapması (profil + imza dahil).
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="${{ steps.meta.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: IPA'ya aktar (export)
        if: steps.gate.outputs.ok == 'true'
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEYFILE" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.ok == 'true'
        with:
          name: enerji-baglantisi-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: TestFlight'a yükle
        if: steps.gate.outputs.ok == 'true'
        # App Store Connect'te "Enerji Bağlantisi" uygulama kaydı zaten var (bundle id
        # com.enerji.baglantisi) -> altool'un aradığı .p8 klasörüne kopyalayıp yüklüyoruz.
        run: |
          IPA="$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)"
          echo "-- yüklenecek: $IPA --"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$KEYFILE" "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
