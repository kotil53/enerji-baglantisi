name: iOS derleme

# Derlemenin bozulmadığını doğrular: imzasız Release archive üretir.
# App Store'a yüklenebilir imzalı IPA için Apple sertifikası + provisioning
# profili sırları gerekir — bkz. capacitor-app/README.md "CI / Otomatik derleme".

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - "enerji-bulmaca.html"
      - "capacitor-app/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive:
    runs-on: macos-14
    defaults:
      run:
        working-directory: capacitor-app
    env:
      ADMOB_APP_ID_IOS: ${{ secrets.ADMOB_APP_ID_IOS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: capacitor-app/package-lock.json

      - name: Bağımlılıklar
        run: npm ci

      - name: Sürüm adını belirle
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Native projeyi üret (sync + cap add ios + native:config + pod install)
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
        run: npm run add:ios

      - name: İmzasız archive
        working-directory: capacitor-app/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="${{ steps.meta.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Archive'ı paketle
        run: ditto -c -k --keepParent "$RUNNER_TEMP/App.xcarchive" "$RUNNER_TEMP/App.xcarchive.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: enerji-baglantisi-ios-xcarchive
          path: ${{ runner.temp }}/App.xcarchive.zip
          if-no-files-found: error
