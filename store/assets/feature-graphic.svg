<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ad6c2"/>
      <stop offset="1" stop-color="#ffce3a"/>
    </linearGradient>
    <radialGradient id="src" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#8bffe9"/>
      <stop offset="1" stop-color="#11b39d"/>
    </radialGradient>
    <radialGradient id="bulb" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#fff7cf"/>
      <stop offset="1" stop-color="#ffc531"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.28" cy="0.5" r="0.95">
      <stop offset="0" stop-color="#121c34"/>
      <stop offset="1" stop-color="#0a0e1a"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="11" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="500" fill="url(#vign)"/>

  <!-- ince ızgara (bulmaca tahtası hissi) -->
  <g stroke="#1a2540" stroke-width="2" opacity="0.8">
    <path d="M0 100H1024M0 200H1024M0 300H1024M0 400H1024"/>
    <path d="M100 0V500M200 0V500M300 0V500M400 0V500M500 0V500M600 0V500M700 0V500M800 0V500M900 0V500"/>
  </g>

  <!-- sol: kablo motifi -->
  <g transform="translate(72 86)">
    <rect x="-22" y="-22" width="332" height="332" rx="42" fill="#0e1526" stroke="#20304e" stroke-width="4"/>

    <g filter="url(#glow)" fill="none" stroke="url(#wire)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
      <path d="M70 70 H214 V156 H112 V262 H214"/>
    </g>

    <g filter="url(#glow)">
      <rect x="36" y="36" width="68" height="68" rx="19" fill="url(#src)" stroke="#0b7d70" stroke-width="5"/>
      <path d="M78 48 L96 74 L81 77 L91 105 L61 74 L76 71 Z" fill="#06342f"/>
    </g>

    <g filter="url(#glow)" transform="translate(214 262)">
      <circle r="44" fill="url(#bulb)"/>
      <path d="M-19 7 Q0 -25 19 7" fill="none" stroke="#b06a12" stroke-width="6" stroke-linecap="round"/>
      <rect x="-12" y="38" width="24" height="14" rx="4" fill="#caa24a"/>
    </g>
  </g>

  <!-- sağ: başlık -->
  <g transform="translate(452 0)">
    <text x="0" y="204" font-family="Arial, 'Segoe UI', sans-serif" font-weight="bold"
          font-size="76" letter-spacing="1" fill="#eef1f8">ENERJİ</text>
    <text x="0" y="288" font-family="Arial, 'Segoe UI', sans-serif" font-weight="bold"
          font-size="76" letter-spacing="1" fill="#3ad6c2">BAĞLANTISI</text>
    <text x="3" y="344" font-family="Arial, 'Segoe UI', sans-serif" font-weight="normal"
          font-size="25" fill="#9aa5c8">Kabloları döndür, devreyi tamamla.</text>
  </g>
</svg>
